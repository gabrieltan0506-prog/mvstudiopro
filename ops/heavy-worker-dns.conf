# Private loopback resolver for the heavy worker; never expose DNS on 6PN.
listen-address=127.0.0.1
bind-interfaces
no-resolv
no-hosts
pid-file=/run/heavy-worker-dns.pid
log-facility=-
# DNS query logging is deliberately disabled.
cache-size=256
no-negcache
# Public names must not depend on the failing Fly recursive path.
server=1.1.1.1
server=8.8.8.8
# Preserve Fly service discovery, Flycast and private reverse lookups.
server=/internal/fdaa::3
server=/flycast/fdaa::3
server=/ip6.arpa/fdaa::3
server=/in-addr.arpa/fdaa::3
# Single-label lookups stay inside Fly, never sent to public resolvers.
server=//fdaa::3
