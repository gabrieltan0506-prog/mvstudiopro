        <h2>三条完整流水线</h2>
        <ul>
          <li>
            <strong>一份长文档</strong>（书稿、行业报告、课件、PDF）：自动完成 OCR 与提炼，

            九万字的书通常落到五到七页。
          </li>
          <li>
            <strong>一个选题</strong>：平台趋势看板、选题推荐、六维全案文案、动效 PPT。
          </li>
          <li>
            <strong>一条参考视频或一组静帧</strong>：逐帧视觉拆解、分镜脚本、关键静帧、成片，
            最长可做整集漫剧，一集四到六段、约两分钟。
          </li>
        </ul>

        <h2>核心能力</h2>
        <ul>
          <li>图文知识卡片：提炼分精细、均衡、轻量三档，按预算自选；出图前先算清成本再决定。</li>
          <li>漫剧编剧室：剧本到分镜到成片的整集流水线，角色跨集一致，静帧可复用。</li>
          <li>创作画布：节点式工作流，出图与成片在同一张画布上串联，支持多图参考、运镜与对白控制、局部重拍、画质提升。</li>
          <li>创作者成长营：对标视频逐帧视觉分析与战略推演，输出可执行清单。</li>
          <li>趋势看板：抖音、快手、B 站、小红书、头条多平台趋势与样本库。</li>
        </ul>
