name: Vercel 清理器离线验证
# 真实每日清理由 Fly 启动的 vercelPreviewScheduler 执行；CI 只验证，不持有 Vercel 凭证。
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/vercel-prune-preview-deployments*"
      - "scripts/vercelPruneSelect*"
      - "scripts/vercelPruneLock*"
      - "server/ops/vercelPreviewScheduler*"
      - "server/ops/vercelPreviewRuntime*"
      - "server/_core/index.ts"
      - ".github/workflows/vercel-deployment-prune.yml"
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: 纯离线清理安全回归
        run: node --test scripts/vercel-prune-preview-deployments.test.mjs scripts/vercelPruneLock.test.mjs
      - run: corepack enable
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: 调度和选择器回归
        run: pnpm exec vitest run server/ops/vercelPreviewScheduler.test.ts server/ops/vercelPreviewRuntime.test.ts server/growth/vercelPruneSelect.test.ts
