name: Growth Archive Offload

# 冷备旁路：卸 Fly archive 分片到同一 Release。与 growth-backup.yml 同写 growth-cold-store-latest；
# 改频率必须两条一起改（#994 只改冷备留下本文件每小时，用户仍看到约每小时上传）。
on:
  schedule:
    # 每 3 小时（UTC :30）。必须与 growth-backup 的 0 */3 同频，错开 30 分钟，减少串行排队。
    - cron: "47 */3 * * *"  # 与 Growth Backup 错开 30 分钟，同样避开整点/半点
  workflow_dispatch:
    inputs:
      archive_dir:
        description: '可选：仅处理一个已通过候选筛选的旧归档桶'
        required: false
        type: string

concurrency:
  group: growth-cold-store-fly
  cancel-in-progress: false

jobs:
  offload:
    name: Offload old growth archive shards from Fly
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      GROWTH_BACKUP_TRANSPORT: fly
      GROWTH_ARCHIVE_PROBE_DIR: ${{ inputs.archive_dir || '' }}
      GROWTH_BACKUP_REPOSITORY: ${{ vars.GROWTH_BACKUP_REPOSITORY || 'gabrieltan0506-prog/mvstudiopro-growth-data' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: superfly/flyctl-actions/setup-flyctl@master
      # 0831 修：与 growth-backup.yml 同因——未指定 --machine 时 flyctl 会往 stdout
      # 打印「No machine specified, ...」，污染被重定向当作数据用的输出。
      - name: Resolve production app machine
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          MACHINE_ID="$(flyctl machines list -a mvstudiopro --json </dev/null \
            | jq -r '[.[] | select(.config.metadata.fly_process_group == "app")
                            | select(.state == "started")][0].id // empty')"
          if [ -z "$MACHINE_ID" ]; then
            echo "未找到 started 状态的 app 进程组机器，卸载中止（不猜机器）" >&2
            exit 1
          fi
          echo "FLY_MACHINE_ID=$MACHINE_ID" >> "$GITHUB_ENV"
      - name: Require authorized private backup target
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: node scripts/growth-backup-target.mjs
      - name: Verify deployed cold-store routing
        timeout-minutes: 2
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          # 新工作流先于服务器上线时明确暂停，不能发布旧读取器无法恢复的新归档。
          timeout --kill-after=5s 60s flyctl ssh console -a mvstudiopro --machine "$FLY_MACHINE_ID" \
            -C "node /app/scripts/growth-cold-store-routing-check.mjs '$GROWTH_BACKUP_REPOSITORY'" </dev/null | jq -e '.codeAndConfigurationReady == true and .metadataReadable == true and .restoreVerified == false'
      - name: Create leased archive snapshot on Fly
        timeout-minutes: 15
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          mkdir -p /tmp/growth-archive-offload
          BATCH_ID="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          printf '%s\n' "$BATCH_ID" > /tmp/growth-archive-offload/batch-id.txt
          # 先验证再插入远端shell参数；仅日期桶或空值可进入prepare。
          node -e 'const v=process.env.GROWTH_ARCHIVE_PROBE_DIR||"";if(v&&(!/^\d{4}-\d{2}-\d{2}(?:-\d{2})?$/.test(v)||/[\r\n]/.test(v)))throw Error("archive_probe_directory_invalid")'
          SNAPSHOT_READY=false
          for attempt in $(seq 1 20); do
            rm -f /tmp/growth-archive-offload/snapshot.tsv.next
            if node scripts/growth-archive-transfer.mjs --max-ms 120000 -- flyctl ssh console -a mvstudiopro --machine "$FLY_MACHINE_ID" \
              -C "sh -s -- prepare '$BATCH_ID' '${GROWTH_ARCHIVE_PROBE_DIR:-}'" \
              < scripts/growth-archive-offload-remote.sh \
              > /tmp/growth-archive-offload/snapshot.tsv.next; then
              mv /tmp/growth-archive-offload/snapshot.tsv.next /tmp/growth-archive-offload/snapshot.tsv
              SNAPSHOT_READY=true
              break
            else
              transfer_status=$?
            fi
            if [ "$transfer_status" -ne 75 ]; then
              echo "::error::archive 快照失败（status=${transfer_status}），停止本轮；保留源数据"
              exit "$transfer_status"
            fi
            echo "采集 lease 或前台任务繁忙，archive 快照让行 30 秒（${attempt}/20）"
            sleep 30
          done
          if [ "$SNAPSHOT_READY" != "true" ]; then
            # 让行不是失败：本工作流只做 archive 卸载，采集繁忙时交给下一班次即可。
            echo "采集持续繁忙，archive offload 让行至下一班次"
            echo "::warning::采集持续繁忙，本轮 archive offload 让行；若连续多轮出现请关注 /data 空间"
            touch /tmp/growth-archive-offload/EMPTY
            exit 0
          fi
          flyctl ssh console -a mvstudiopro --machine "$FLY_MACHINE_ID" \
            -C "sh -s -- report '$BATCH_ID'" < scripts/growth-archive-offload-remote.sh \
            > /tmp/growth-archive-offload/source-inventory.json
          node -e 'const fs=require("fs"),r=JSON.parse(fs.readFileSync("/tmp/growth-archive-offload/source-inventory.json"));fs.writeFileSync("/tmp/growth-archive-offload/anomalies.jsonl",r.anomalies.map(x=>JSON.stringify(x)).join("\n"));fs.writeFileSync("/tmp/growth-archive-offload/uncovered.jsonl",(r.uncovered||[]).map(x=>JSON.stringify(x)).join("\n"))'
          if [ -s /tmp/growth-archive-offload/anomalies.jsonl ]; then
            echo "::warning::存在异常归档，完整保留其来源；健康目录继续备份。详见 anomalies.jsonl"
            echo "部分完成：异常目录完整保留，未授权清理任何来源。" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -s /tmp/growth-archive-offload/uncovered.jsonl ]; then
            echo "::warning::存在未覆盖文件，来源保留；本批不是完整归档备份。详见 uncovered.jsonl"
            echo "部分覆盖：未知平台或文件未打包，不能依据本批清理未覆盖来源。" >> "$GITHUB_STEP_SUMMARY"
          fi
          cut -f1 /tmp/growth-archive-offload/snapshot.tsv > /tmp/growth-archive-offload/dirs.txt
          date -u +"%Y-%m-%dT%H:%M:%SZ" > /tmp/growth-archive-offload/fetched-at.txt
          if [ ! -s /tmp/growth-archive-offload/dirs.txt ]; then
            echo "No archive shards to offload"
            touch /tmp/growth-archive-offload/EMPTY
          fi
      - name: Plan bounded incremental archive batch
        timeout-minutes: 5
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -f /tmp/growth-backup/OFFLOAD_SKIP ] || [ -f /tmp/growth-archive-offload/EMPTY ]; then exit 0; fi
          node scripts/growth-archive-plan.mjs /tmp/growth-archive-offload
      - name: Download and verify archive bundles locally
        timeout-minutes: 30
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -f /tmp/growth-archive-offload/EMPTY ] || [ -f /tmp/growth-archive-offload/UPLOAD_EMPTY ]; then
            echo "No archive shards to offload"
            exit 0
          fi
          BATCH_ID=$(cat /tmp/growth-archive-offload/batch-id.txt)
          mkdir -p /tmp/growth-archive-offload/assets
          : > /tmp/growth-archive-offload/assets.tsv.next
          : > /tmp/growth-archive-offload/archives.tsv.next
          DOWNLOAD_DEADLINE=$((SECONDS + 1200))
          DEFERRED=false
          while IFS=$'\t' read -r dir source_fingerprint source_bytes; do
            [ -n "$dir" ] || continue
            case "$dir" in ""|.|..|*[!0-9A-Za-z._-]*) echo "非法目录名: $dir"; exit 1 ;; esac
            output="/tmp/growth-archive-offload/assets/archive-$dir.tar.gz"
            BUNDLE_READY=false
            for attempt in $(seq 1 20); do
              if [ "$SECONDS" -ge "$DOWNLOAD_DEADLINE" ]; then
                DEFERRED=true
                break
              fi
              rm -f "$output.next"
              echo "开始下载归档：${dir}（${attempt}/20）"
              transfer_budget=$(((DOWNLOAD_DEADLINE - SECONDS) * 1000))
              if [ "$transfer_budget" -gt 900000 ]; then transfer_budget=900000; fi
              if [ "$transfer_budget" -le 0 ]; then DEFERRED=true; break; fi
              if node scripts/growth-archive-transfer.mjs --max-ms "$transfer_budget" -- flyctl ssh console -a mvstudiopro --machine "$FLY_MACHINE_ID" \
                -C "sh -s -- bundle '$BATCH_ID' '$dir'" \
                < scripts/growth-archive-offload-remote.sh \
                > "$output.next"; then
                mv "$output.next" "$output"
                BUNDLE_READY=true
                break
              else
                transfer_status=$?
              fi
              if [ "$transfer_status" -ne 75 ]; then
                echo "::error::归档 $dir 传输失败（status=${transfer_status}），未发布本轮归档；保留源数据"
                exit "$transfer_status"
              fi
              echo "前台任务繁忙，archive bundle 让行 30 秒：$dir（${attempt}/20）"
              sleep 30
            done
            if [ "$BUNDLE_READY" != "true" ]; then
              DEFERRED=true
              rm -f "$output.next"
              break
            fi
            # 不以gzip/tar可打开冒充有效备份：逐成员解压、解析JSON并验证items。
            python3 scripts/validate-growth-archive.py "$dir" "$output"
            asset_bytes=$(stat -c%s "$output")
            asset_sha=$(sha256sum "$output" | awk '{print $1}')
            asset_name=$(basename "$output")
            part_count=0
            # 生产冷读端按稳定名 archive-$dir.tar.gz 恢复。当前小时分片远小于 2GiB，
            # 必须原名上传；超限包仍可分片留证，但下方删除门会保留 Fly 源目录。
            if [ "$asset_bytes" -lt 2000000000 ]; then
              parts=("$output")
            else
              split -b 268435456 -d -a 4 "$output" "$output.part-"
              parts=("$output".part-*)
            fi
            for part in "${parts[@]}"; do
              test -f "$part"
              part_bytes=$(stat -c%s "$part")
              part_sha=$(sha256sum "$part" | awk '{print $1}')
              test "$part_bytes" -lt 2147483648
              printf '%s\t%s\t%s\t%s\t%s\t%s\n' \
                "$dir" "$(basename "$part")" "$part_bytes" "$part_sha" "$asset_name" "$part_count" \
                >> /tmp/growth-archive-offload/assets.tsv.next
              part_count=$((part_count + 1))
            done
            test "$part_count" -gt 0
            printf '%s\t%s\t%s\t%s\t%s\t%s\t%s\n' \
              "$dir" "$asset_name" "$asset_bytes" "$asset_sha" "$source_fingerprint" "$source_bytes" "$part_count" \
              >> /tmp/growth-archive-offload/archives.tsv.next
            if [ "$asset_bytes" -ge 2000000000 ]; then rm -f "$output"; fi
            sleep 5
          done < /tmp/growth-archive-offload/selected.tsv
          mv /tmp/growth-archive-offload/assets.tsv.next /tmp/growth-archive-offload/assets.tsv
          mv /tmp/growth-archive-offload/archives.tsv.next /tmp/growth-archive-offload/archives.tsv
          completed=$(wc -l < /tmp/growth-archive-offload/archives.tsv)
          planned=$(wc -l < /tmp/growth-archive-offload/selected.tsv)
          if [ "$DEFERRED" = "true" ]; then
            echo "::warning::前台繁忙或本批时间预算用尽：已下载验真 ${completed}/${planned} 个；其余归档延期，源数据保留。"
            printf '归档延期：本批下载验真 %s/%s 个，尚未发布的目录下轮续传。\n' "$completed" "$planned" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
            touch /tmp/growth-archive-offload/DEFERRED
            if [ "$completed" -eq 0 ]; then touch /tmp/growth-archive-offload/EMPTY; fi
          else
            test "$completed" -eq "$planned"
          fi
      # 旧备份不删除；新增分片与归档使用独立 Release，避免 1000 附件上限。
      - name: Publish and read back archive bundles
        timeout-minutes: 30
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -f /tmp/growth-archive-offload/EMPTY ] || [ -f /tmp/growth-archive-offload/UPLOAD_EMPTY ]; then
            echo "No archive shards to publish"
            exit 0
          fi
          GROWTH_REQUIRE_SOURCE_INVENTORY=1 node scripts/growth-archive-publish.mjs /tmp/growth-archive-offload
      - name: Upload GitHub archive offload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: growth-archive-offload-${{ github.run_id }}
          path: |
            /tmp/growth-archive-offload/*.json
            /tmp/growth-archive-offload/*.jsonl
            /tmp/growth-archive-offload/*.tsv
            /tmp/growth-archive-offload/UPLOAD_VERIFIED
          if-no-files-found: error
          retention-days: 30


      - name: Always release archive hardlink snapshot
        timeout-minutes: 2
        if: always()
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ ! -s /tmp/growth-archive-offload/batch-id.txt ]; then
            exit 0
          fi
          BATCH_ID=$(cat /tmp/growth-archive-offload/batch-id.txt)
          if timeout --kill-after=5s 60s flyctl ssh console -a mvstudiopro --machine "$FLY_MACHINE_ID" \
            -C "sh -s -- cleanup '$BATCH_ID'" \
            < scripts/growth-archive-offload-remote.sh; then
            touch /tmp/growth-archive-offload/SNAPSHOT_RELEASED
          else
            echo "::warning::临时快照清理未完成，保留待后续回收；未删除源归档"
          fi

      - name: Retire verified Bilibili archive sources
        if: success()
        timeout-minutes: 20
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          ROOT=/tmp/growth-archive-offload
          if [ ! -s "$ROOT/publication-result.json" ] && [ ! -s "$ROOT/reused-cleanup-input.json" ]; then
            echo "本批无已发布或已备份可复用归档，保留全部来源"
            exit 0
          fi
          if [ ! -f "$ROOT/SNAPSHOT_RELEASED" ]; then
            echo "::warning::本批临时快照尚未确认释放，跳过来源清理"
            exit 0
          fi
          : "${FLY_MACHINE_ID:?缺少本批已核对的机器ID}"
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import path from "node:path";
          const root="/tmp/growth-archive-offload";
          const read=file=>JSON.parse(fs.readFileSync(path.join(root,file),"utf8"));
          const expected=`${process.env.GITHUB_RUN_ID}-${process.env.GITHUB_RUN_ATTEMPT}`;
          const write=(label,payload)=>{
            const {batch,publication,manifests}=payload;
            if (![expected,`${expected}-backup`].includes(batch?.batchId) || publication?.batchId!==batch.batchId
                || batch.schemaVersion!==3 || !Array.isArray(batch.archives) || !batch.archives.length)
              throw Error("retirement_batch_identity_invalid");
            for(const entry of batch.archives){
              if(!/^\d{4}-\d{2}-\d{2}(?:-\d{2})?$/.test(entry.dir)
                  || typeof manifests?.[`archive-${entry.dir}.manifest.json`]!=="string")
                throw Error("retirement_manifest_missing_or_invalid");
            }
            fs.writeFileSync(path.join(root,`retirement-request-${label}.json`),JSON.stringify(payload),{flag:"wx",mode:0o600});
          };
          if(fs.existsSync(path.join(root,"publication-result.json"))){
            const batch=read("offload-manifest.json"),publication=read("publication-result.json"),manifests={};
            for(const entry of batch.archives){
              if(!/^\d{4}-\d{2}-\d{2}(?:-\d{2})?$/.test(entry.dir))throw Error("retirement_directory_invalid");
              const name=`archive-${entry.dir}.manifest.json`;
              manifests[name]=fs.readFileSync(path.join(root,"assets",name)).toString("base64");
            }
            write("new",{batch,publication,manifests});
          }
          if(fs.existsSync(path.join(root,"reused-cleanup-input.json")))write("reused",read("reused-cleanup-input.json"));
          NODE
          # 服务端采集/变更锁被占时清理脚本立刻报 growth_cleanup_busy；这是真实竞争不是陈旧锁，
          # 等一等再试即可，不该让整个 run 红掉（1109 事故：07:01Z run 仅此一步失败）。
          for kind in new reused; do
            request="$ROOT/retirement-request-$kind.json"
            [ -s "$request" ] || continue
            attempt=0
            while :; do
              attempt=$((attempt+1))
              status=0
              timeout --kill-after=10s 540s flyctl ssh console -a mvstudiopro --machine "$FLY_MACHINE_ID" \
                -C "sh -lc 'cd /app && GROWTH_STORE_DIR=/data/growth node scripts/growth-archive-retire.mjs --scope=bilibili-archives --allow-remote-download'" \
                < "$request" > "$ROOT/retirement-result-$kind.json" || status=$?
              cat "$ROOT/retirement-result-$kind.json"
              if [ "$status" -eq 0 ] || ! grep -q '"growth_cleanup_busy"' "$ROOT/retirement-result-$kind.json"; then
                [ "$status" -eq 0 ] || exit "$status"
                break
              fi
              if [ "$attempt" -ge "${GROWTH_RETIRE_BUSY_ATTEMPTS:-8}" ]; then
                echo "::warning::来源清理($kind)连续 $attempt 次遇到服务端采集锁 growth_cleanup_busy，本批延后到下一班再清，未删除任何来源"
                printf '来源清理(%s)因 growth_cleanup_busy 延后，未删除来源。\n' "$kind" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
                touch "$ROOT/RETIREMENT_DEFERRED_$kind"
                continue 2
              fi
              echo "来源清理($kind)第 $attempt 次遇到 growth_cleanup_busy，${GROWTH_RETIRE_BUSY_WAIT_SECONDS:-60}s 后重试"
              sleep "${GROWTH_RETIRE_BUSY_WAIT_SECONDS:-60}"
            done
          done
          if ! ls "$ROOT"/RETIREMENT_DEFERRED_* >/dev/null 2>&1; then
            printf '本批B站归档还原核验与逐文件清理已执行；实际删除与空间变化见retirement-result-*.json。\n' >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          fi
      - name: Preserve archive retirement receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: growth-archive-retirement-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/growth-archive-offload/retirement-request-*.json
            /tmp/growth-archive-offload/retirement-result-*.json
          if-no-files-found: ignore
          retention-days: 30
