name: Growth Archive Offload

# 冷备旁路：卸 Fly archive 分片到同一 Release。与 growth-backup.yml 同写 growth-cold-store-latest；
# 改频率必须两条一起改（#994 只改冷备留下本文件每小时，用户仍看到约每小时上传）。
on:
  schedule:
    # 每 3 小时（UTC :30）。必须与 growth-backup 的 0 */3 同频，错开 30 分钟，减少串行排队。
    - cron: "30 */3 * * *"
  workflow_dispatch:

concurrency:
  group: growth-cold-store-fly
  cancel-in-progress: false

jobs:
  offload:
    name: Offload old growth archive shards from Fly
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: superfly/flyctl-actions/setup-flyctl@master
      # 0831 修：与 growth-backup.yml 同因——未指定 --machine 时 flyctl 会往 stdout
      # 打印「No machine specified, ...」，污染被重定向当作数据用的输出。
      - name: Resolve production app machine
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          MACHINE_ID="$(flyctl machines list -a mvstudiopro --json </dev/null \
            | jq -r '[.[] | select(.config.metadata.fly_process_group == "app")
                            | select(.state == "started")][0].id // empty')"
          if [ -z "$MACHINE_ID" ]; then
            echo "未找到 started 状态的 app 进程组机器，卸载中止（不猜机器）" >&2
            exit 1
          fi
          echo "FLY_MACHINE_ID=$MACHINE_ID" >> "$GITHUB_ENV"
      - name: Create leased archive snapshot on Fly
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          mkdir -p /tmp/growth-archive-offload
          BATCH_ID="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          printf '%s\n' "$BATCH_ID" > /tmp/growth-archive-offload/batch-id.txt
          SNAPSHOT_READY=false
          for attempt in $(seq 1 20); do
            rm -f /tmp/growth-archive-offload/snapshot.tsv.next
            if flyctl ssh console -a mvstudiopro --machine "$FLY_MACHINE_ID" \
              -C "sh -s -- prepare '$BATCH_ID'" \
              < scripts/growth-archive-offload-remote.sh \
              > /tmp/growth-archive-offload/snapshot.tsv.next; then
              mv /tmp/growth-archive-offload/snapshot.tsv.next /tmp/growth-archive-offload/snapshot.tsv
              SNAPSHOT_READY=true
              break
            fi
            echo "采集 lease 或前台任务繁忙，archive 快照让行 30 秒（${attempt}/20）"
            sleep 30
          done
          if [ "$SNAPSHOT_READY" != "true" ]; then
            # 让行不是失败：本工作流只做 archive 卸载，采集繁忙时交给下一班次即可。
            echo "采集持续繁忙，archive offload 让行至下一班次"
            echo "::warning::采集持续繁忙，本轮 archive offload 让行；若连续多轮出现请关注 /data 空间"
            touch /tmp/growth-archive-offload/EMPTY
            exit 0
          fi
          cut -f1 /tmp/growth-archive-offload/snapshot.tsv > /tmp/growth-archive-offload/dirs.txt
          date -u +"%Y-%m-%dT%H:%M:%SZ" > /tmp/growth-archive-offload/fetched-at.txt
          if [ ! -s /tmp/growth-archive-offload/dirs.txt ]; then
            echo "No archive shards to offload"
            touch /tmp/growth-archive-offload/EMPTY
          fi
      - name: Download and verify archive bundles locally
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -f /tmp/growth-archive-offload/EMPTY ]; then
            echo "No archive shards to offload"
            exit 0
          fi
          BATCH_ID=$(cat /tmp/growth-archive-offload/batch-id.txt)
          mkdir -p /tmp/growth-archive-offload/assets
          : > /tmp/growth-archive-offload/assets.tsv.next
          : > /tmp/growth-archive-offload/archives.tsv.next
          while IFS=$'\t' read -r dir source_fingerprint source_bytes; do
            [ -n "$dir" ] || continue
            case "$dir" in ""|.|..|*[!0-9A-Za-z._-]*) echo "非法目录名: $dir"; exit 1 ;; esac
            output="/tmp/growth-archive-offload/assets/archive-$dir.tar.gz"
            BUNDLE_READY=false
            for attempt in $(seq 1 20); do
              rm -f "$output.next"
              if flyctl ssh console -a mvstudiopro --machine "$FLY_MACHINE_ID" \
                -C "sh -s -- bundle '$BATCH_ID' '$dir'" \
                < scripts/growth-archive-offload-remote.sh \
                > "$output.next"; then
                mv "$output.next" "$output"
                BUNDLE_READY=true
                break
              fi
              echo "前台任务繁忙，archive bundle 让行 30 秒：$dir（${attempt}/20）"
              sleep 30
            done
            test "$BUNDLE_READY" = "true"
            gzip -t "$output"
            tar -tzf "$output" > "$output.list"
            awk -v root="$dir" '$0 != root && index($0, root "/") != 1 { exit 1 }' "$output.list"
            asset_bytes=$(stat -c%s "$output")
            asset_sha=$(sha256sum "$output" | awk '{print $1}')
            asset_name=$(basename "$output")
            part_count=0
            # 生产冷读端按稳定名 archive-$dir.tar.gz 恢复。当前小时分片远小于 2GiB，
            # 必须原名上传；超限包仍可分片留证，但下方删除门会保留 Fly 源目录。
            if [ "$asset_bytes" -lt 2000000000 ]; then
              parts=("$output")
            else
              split -b 268435456 -d -a 4 "$output" "$output.part-"
              parts=("$output".part-*)
            fi
            for part in "${parts[@]}"; do
              test -f "$part"
              part_bytes=$(stat -c%s "$part")
              part_sha=$(sha256sum "$part" | awk '{print $1}')
              test "$part_bytes" -lt 2147483648
              printf '%s\t%s\t%s\t%s\t%s\t%s\n' \
                "$dir" "$(basename "$part")" "$part_bytes" "$part_sha" "$asset_name" "$part_count" \
                >> /tmp/growth-archive-offload/assets.tsv.next
              part_count=$((part_count + 1))
            done
            test "$part_count" -gt 0
            printf '%s\t%s\t%s\t%s\t%s\t%s\t%s\n' \
              "$dir" "$asset_name" "$asset_bytes" "$asset_sha" "$source_fingerprint" "$source_bytes" "$part_count" \
              >> /tmp/growth-archive-offload/archives.tsv.next
            rm -f "$output.list"
            if [ "$asset_bytes" -ge 2000000000 ]; then rm -f "$output"; fi
            sleep 5
          done < /tmp/growth-archive-offload/snapshot.tsv
          mv /tmp/growth-archive-offload/assets.tsv.next /tmp/growth-archive-offload/assets.tsv
          mv /tmp/growth-archive-offload/archives.tsv.next /tmp/growth-archive-offload/archives.tsv
          test "$(wc -l < /tmp/growth-archive-offload/archives.tsv)" -eq "$(wc -l < /tmp/growth-archive-offload/snapshot.tsv)"
      - name: Prune superseded batch snapshot assets from cold-store release
        env:
          GH_TOKEN: ${{ github.token }}
        # 0826 事故：Release 撞 1000 资产上限后所有上传 422。上传前先清旧批次快照分片；
        # archive-* 冷存档（Fly 已删数据唯一副本）与稳定名资产不在清理范围。
        run: bash scripts/prune-growth-release-batch-assets.sh
      - name: Publish and read back archive bundles
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f /tmp/growth-archive-offload/EMPTY ]; then
            echo "No archive shards to publish"
            exit 0
          fi
          upload_and_readback_asset() {
            local asset="$1"
            local asset_name expected_bytes expected_sha verify_dir actual_bytes actual_sha
            asset_name=$(basename "$asset")
            expected_bytes=$(stat -c%s "$asset")
            expected_sha=$(sha256sum "$asset" | awk '{print $1}')
            verify_dir=/tmp/growth-archive-offload/release-readback
            mkdir -p "$verify_dir"
            for attempt in 1 2 3 4 5; do
              if gh release upload growth-cold-store-latest "$asset#$asset_name" --clobber; then
                rm -f "$verify_dir/$asset_name"
                if gh release download growth-cold-store-latest -p "$asset_name" -D "$verify_dir" --clobber; then
                  actual_bytes=$(stat -c%s "$verify_dir/$asset_name")
                  actual_sha=$(sha256sum "$verify_dir/$asset_name" | awk '{print $1}')
                  if [ "$actual_bytes" = "$expected_bytes" ] && [ "$actual_sha" = "$expected_sha" ]; then
                    printf '%s\t%s\t%s\n' "$asset_name" "$expected_bytes" "$expected_sha" \
                      >> /tmp/growth-archive-offload/verified-assets.tsv
                    return 0
                  fi
                fi
              fi
              echo "Release 上传/回读重试：$asset_name（${attempt}/5）"
              sleep 20
            done
            return 1
          }

          gh release view growth-cold-store-latest >/dev/null 2>&1 || \
            gh release create growth-cold-store-latest --title "Growth Cold Store Latest" --notes "Latest cold-store restore assets"
          : > /tmp/growth-archive-offload/verified-assets.tsv
          while IFS=$'\t' read -r dir asset_name asset_bytes asset_sha archive_name part_index; do
            [ -n "$dir" ] || continue
            upload_and_readback_asset "/tmp/growth-archive-offload/assets/$asset_name"
          done < /tmp/growth-archive-offload/assets.tsv
          node <<'NODE'
          const fs = require("fs");
          const crypto = require("crypto");
          const parse = (file) => fs.readFileSync(file, "utf8").trim().split(/\r?\n/).filter(Boolean).map((line) => line.split("\t"));
          const batchId = fs.readFileSync("/tmp/growth-archive-offload/batch-id.txt", "utf8").trim();
          const parts = parse("/tmp/growth-archive-offload/assets.tsv").map(([dir, asset, bytes, sha256, archive, partIndex]) => ({
            dir, asset, bytes: Number(bytes), sha256, archive, partIndex: Number(partIndex),
          }));
          const archives = parse("/tmp/growth-archive-offload/archives.tsv").map(([dir, asset, bytes, sha256, sourceFingerprint, sourceBytes, partCount]) => ({
            dir, asset, bytes: Number(bytes), sha256, sourceFingerprint, sourceBytes: Number(sourceBytes),
            parts: parts.filter((entry) => entry.dir === dir).sort((a, b) => a.partIndex - b.partIndex).map(({ asset: partAsset, bytes: partBytes, sha256: partSha, partIndex }) => ({ asset: partAsset, bytes: partBytes, sha256: partSha, partIndex })),
            partCount: Number(partCount),
          }));
          const verified = new Set(parse("/tmp/growth-archive-offload/verified-assets.tsv").map(([asset]) => asset));
          if (!archives.length || archives.some((entry) => entry.parts.length !== entry.partCount || entry.parts.some((part) => !verified.has(part.asset)))) throw new Error("archive release read-back incomplete");
          const manifestRows = [];
          for (const entry of archives) {
            const manifestAsset = `archive-${entry.dir}.manifest.json`;
            const perDir = {
              schemaVersion: 1,
              dir: entry.dir,
              archive: { assetName: entry.asset, bytes: entry.bytes, sha256: entry.sha256 },
              parts: entry.parts.map((part) => ({ assetName: part.asset, bytes: part.bytes, sha256: part.sha256, index: part.partIndex })),
            };
            const manifestPath = `/tmp/growth-archive-offload/assets/${manifestAsset}`;
            const raw = Buffer.from(JSON.stringify(perDir, null, 2));
            fs.writeFileSync(manifestPath, raw);
            manifestRows.push([manifestAsset, raw.length, crypto.createHash("sha256").update(raw).digest("hex")].join("\t"));
            entry.manifestAsset = manifestAsset;
          }
          fs.writeFileSync("/tmp/growth-archive-offload/manifest-assets.tsv", `${manifestRows.join("\n")}\n`);
          const manifest = {
            schemaVersion: 3,
            batchId,
            createdAt: new Date().toISOString(),
            baseUrl: "https://github.com/gabrieltan0506-prog/mvstudiopro/releases/download/growth-cold-store-latest",
            archiveDirs: archives.map((entry) => entry.dir),
            archives,
            thresholdsMb: { targetAvailableSpace: 1200 },
          };
          fs.writeFileSync("/tmp/growth-archive-offload/offload-manifest.json", JSON.stringify(manifest, null, 2));
          NODE
          while IFS=$'\t' read -r manifest_asset manifest_bytes manifest_sha; do
            [ -n "$manifest_asset" ] || continue
            upload_and_readback_asset "/tmp/growth-archive-offload/assets/$manifest_asset"
          done < /tmp/growth-archive-offload/manifest-assets.tsv
          upload_and_readback_asset /tmp/growth-archive-offload/offload-manifest.json
          sha256sum /tmp/growth-archive-offload/offload-manifest.json > /tmp/growth-archive-offload/DELETE_READY
      - name: Upload GitHub archive offload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: growth-archive-offload-${{ github.run_id }}
          path: /tmp/growth-archive-offload
          if-no-files-found: error
          retention-days: 30
      - name: Delete only release-verified unchanged shards from Fly
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -f /tmp/growth-archive-offload/EMPTY ]; then
            exit 0
          fi
          test -s /tmp/growth-archive-offload/DELETE_READY
          test -s /tmp/growth-archive-offload/verified-assets.tsv
          test -s /tmp/growth-archive-offload/manifest-assets.tsv
          BATCH_ID=$(cat /tmp/growth-archive-offload/batch-id.txt)
          while IFS=$'\t' read -r dir archive_name archive_bytes archive_sha source_fingerprint source_bytes part_count; do
            [ -n "$dir" ] || continue
            verified_part_count=0
            while IFS=$'\t' read -r part_dir part_asset part_bytes part_sha part_archive part_index; do
              [ "$part_dir" = "$dir" ] || continue
              awk -F '\t' -v asset="$part_asset" -v bytes="$part_bytes" -v sha="$part_sha" \
                '$1 == asset && $2 == bytes && $3 == sha { found=1 } END { exit(found ? 0 : 1) }' \
                /tmp/growth-archive-offload/verified-assets.tsv
              verified_part_count=$((verified_part_count + 1))
            done < /tmp/growth-archive-offload/assets.tsv
            test "$verified_part_count" -eq "$part_count"
            manifest_asset="archive-$dir.manifest.json"
            awk -F '\t' -v asset="$manifest_asset" '$1 == asset { found=1 } END { exit(found ? 0 : 1) }' \
              /tmp/growth-archive-offload/manifest-assets.tsv
            awk -F '\t' -v asset="$manifest_asset" '$1 == asset { found=1 } END { exit(found ? 0 : 1) }' \
              /tmp/growth-archive-offload/verified-assets.tsv
            direct_asset_count=$(awk -F '\t' -v dir="$dir" -v archive="$archive_name" \
              '$1 == dir && $2 == archive && $5 == archive { count++ } END { print count+0 }' \
              /tmp/growth-archive-offload/assets.tsv)
            if [ "$part_count" -ne 1 ] || [ "$direct_asset_count" -ne 1 ]; then
              echo "::warning::归档 $dir 仅有分片证据，生产冷读端尚不能直接恢复；保留 Fly 源目录"
              continue
            fi
            # 删除前必须让当前正式镜像用生产读取器实际下载、校验 manifest/SHA、
            # 安全解包并逐个解压解析 JSON；仅有 Release read-back 不能证明消费端可恢复。
            flyctl ssh console -a mvstudiopro --machine "$FLY_MACHINE_ID" \
              -C "GROWTH_GITHUB_OFFLOAD_CACHE_DIR=/tmp/growth-cold-verify-$dir GROWTH_COLD_VERIFY_CLEANUP=1 pnpm exec tsx server/growth/growthArchiveColdRestoreCli.ts '$dir'"
            DELETED=false
            for attempt in $(seq 1 20); do
              if flyctl ssh console -a mvstudiopro --machine "$FLY_MACHINE_ID" \
                -C "sh -s -- delete '$BATCH_ID' '$dir' '$source_fingerprint'" \
                < scripts/growth-archive-offload-remote.sh; then
                DELETED=true
                break
              fi
              echo "采集 lease 或前台任务繁忙，删除继续让行：$dir（${attempt}/20）"
              sleep 30
            done
            test "$DELETED" = "true"
          done < /tmp/growth-archive-offload/archives.tsv
          flyctl ssh console -a mvstudiopro --machine "$FLY_MACHINE_ID" \
            -C "sh -s -- cleanup '$BATCH_ID'" \
            < scripts/growth-archive-offload-remote.sh
      - name: Always release archive hardlink snapshot
        if: always()
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ ! -s /tmp/growth-archive-offload/batch-id.txt ]; then
            exit 0
          fi
          BATCH_ID=$(cat /tmp/growth-archive-offload/batch-id.txt)
          flyctl ssh console -a mvstudiopro --machine "$FLY_MACHINE_ID" \
            -C "sh -s -- cleanup '$BATCH_ID'" \
            < scripts/growth-archive-offload-remote.sh || true
