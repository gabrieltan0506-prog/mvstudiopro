name: Growth Archive Offload

# 冷备旁路：卸 Fly archive 分片到同一 Release。与 growth-backup.yml 同写 growth-cold-store-latest；
# 改频率必须两条一起改（#994 只改冷备留下本文件每小时，用户仍看到约每小时上传）。
on:
  schedule:
    # 每 3 小时（UTC :30）。必须与 growth-backup 的 0 */3 同频，错开 30 分钟，减少串行排队。
    - cron: "30 */3 * * *"
  workflow_dispatch:

concurrency:
  group: growth-cold-store-fly
  cancel-in-progress: false

jobs:
  offload:
    name: Offload old growth archive shards from Fly
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Create leased archive snapshot on Fly
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          mkdir -p /tmp/growth-archive-offload
          BATCH_ID="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          printf '%s\n' "$BATCH_ID" > /tmp/growth-archive-offload/batch-id.txt
          SNAPSHOT_READY=false
          for attempt in $(seq 1 20); do
            rm -f /tmp/growth-archive-offload/snapshot.tsv.next
            if flyctl ssh console -a mvstudiopro \
              -C "sh -s -- prepare '$BATCH_ID'" \
              < scripts/growth-archive-offload-remote.sh \
              > /tmp/growth-archive-offload/snapshot.tsv.next; then
              mv /tmp/growth-archive-offload/snapshot.tsv.next /tmp/growth-archive-offload/snapshot.tsv
              SNAPSHOT_READY=true
              break
            fi
            echo "采集 lease 或前台任务繁忙，archive 快照让行 30 秒（${attempt}/20）"
            sleep 30
          done
          test "$SNAPSHOT_READY" = "true"
          cut -f1 /tmp/growth-archive-offload/snapshot.tsv > /tmp/growth-archive-offload/dirs.txt
          date -u +"%Y-%m-%dT%H:%M:%SZ" > /tmp/growth-archive-offload/fetched-at.txt
          if [ ! -s /tmp/growth-archive-offload/dirs.txt ]; then
            echo "No archive shards to offload"
            touch /tmp/growth-archive-offload/EMPTY
          fi
      - name: Download and verify archive bundles locally
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -f /tmp/growth-archive-offload/EMPTY ]; then
            echo "No archive shards to offload"
            exit 0
          fi
          BATCH_ID=$(cat /tmp/growth-archive-offload/batch-id.txt)
          mkdir -p /tmp/growth-archive-offload/assets
          : > /tmp/growth-archive-offload/assets.tsv.next
          while IFS=$'\t' read -r dir source_fingerprint source_bytes; do
            [ -n "$dir" ] || continue
            case "$dir" in ""|.|..|*[!0-9A-Za-z._-]*) echo "非法目录名: $dir"; exit 1 ;; esac
            output="/tmp/growth-archive-offload/assets/archive-$dir.tar.gz"
            BUNDLE_READY=false
            for attempt in $(seq 1 20); do
              rm -f "$output.next"
              if flyctl ssh console -a mvstudiopro \
                -C "sh -s -- bundle '$BATCH_ID' '$dir'" \
                < scripts/growth-archive-offload-remote.sh \
                > "$output.next"; then
                mv "$output.next" "$output"
                BUNDLE_READY=true
                break
              fi
              echo "前台任务繁忙，archive bundle 让行 30 秒：$dir（${attempt}/20）"
              sleep 30
            done
            test "$BUNDLE_READY" = "true"
            gzip -t "$output"
            tar -tzf "$output" > "$output.list"
            awk -v root="$dir" '$0 != root && index($0, root "/") != 1 { exit 1 }' "$output.list"
            asset_bytes=$(stat -c%s "$output")
            asset_sha=$(sha256sum "$output" | awk '{print $1}')
            printf '%s\t%s\t%s\t%s\t%s\t%s\n' \
              "$dir" "$(basename "$output")" "$asset_bytes" "$asset_sha" "$source_fingerprint" "$source_bytes" \
              >> /tmp/growth-archive-offload/assets.tsv.next
            sleep 5
          done < /tmp/growth-archive-offload/snapshot.tsv
          mv /tmp/growth-archive-offload/assets.tsv.next /tmp/growth-archive-offload/assets.tsv
          test "$(wc -l < /tmp/growth-archive-offload/assets.tsv)" -eq "$(wc -l < /tmp/growth-archive-offload/snapshot.tsv)"
      - name: Publish and read back archive bundles
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f /tmp/growth-archive-offload/EMPTY ]; then
            echo "No archive shards to publish"
            exit 0
          fi
          upload_and_readback_asset() {
            local asset="$1"
            local asset_name expected_bytes expected_sha verify_dir actual_bytes actual_sha
            asset_name=$(basename "$asset")
            expected_bytes=$(stat -c%s "$asset")
            expected_sha=$(sha256sum "$asset" | awk '{print $1}')
            verify_dir=/tmp/growth-archive-offload/release-readback
            mkdir -p "$verify_dir"
            for attempt in 1 2 3 4 5; do
              if gh release upload growth-cold-store-latest "$asset#$asset_name" --clobber; then
                rm -f "$verify_dir/$asset_name"
                if gh release download growth-cold-store-latest -p "$asset_name" -D "$verify_dir" --clobber; then
                  actual_bytes=$(stat -c%s "$verify_dir/$asset_name")
                  actual_sha=$(sha256sum "$verify_dir/$asset_name" | awk '{print $1}')
                  if [ "$actual_bytes" = "$expected_bytes" ] && [ "$actual_sha" = "$expected_sha" ]; then
                    printf '%s\t%s\t%s\n' "$asset_name" "$expected_bytes" "$expected_sha" \
                      >> /tmp/growth-archive-offload/verified-assets.tsv
                    return 0
                  fi
                fi
              fi
              echo "Release 上传/回读重试：$asset_name（${attempt}/5）"
              sleep 20
            done
            return 1
          }

          gh release view growth-cold-store-latest >/dev/null 2>&1 || \
            gh release create growth-cold-store-latest --title "Growth Cold Store Latest" --notes "Latest cold-store restore assets"
          : > /tmp/growth-archive-offload/verified-assets.tsv
          while IFS=$'\t' read -r dir asset_name asset_bytes asset_sha source_fingerprint source_bytes; do
            [ -n "$dir" ] || continue
            upload_and_readback_asset "/tmp/growth-archive-offload/assets/$asset_name"
          done < /tmp/growth-archive-offload/assets.tsv
          node <<'NODE'
          const fs = require("fs");
          const parse = (file) => fs.readFileSync(file, "utf8").trim().split(/\r?\n/).filter(Boolean).map((line) => line.split("\t"));
          const batchId = fs.readFileSync("/tmp/growth-archive-offload/batch-id.txt", "utf8").trim();
          const archives = parse("/tmp/growth-archive-offload/assets.tsv").map(([dir, asset, bytes, sha256, sourceFingerprint, sourceBytes]) => ({
            dir, asset, bytes: Number(bytes), sha256, sourceFingerprint, sourceBytes: Number(sourceBytes),
          }));
          const verified = new Set(parse("/tmp/growth-archive-offload/verified-assets.tsv").map(([asset]) => asset));
          if (!archives.length || archives.some((entry) => !verified.has(entry.asset))) throw new Error("archive release read-back incomplete");
          const manifest = {
            schemaVersion: 2,
            batchId,
            createdAt: new Date().toISOString(),
            baseUrl: "https://github.com/gabrieltan0506-prog/mvstudiopro/releases/download/growth-cold-store-latest",
            archiveDirs: archives.map((entry) => entry.dir),
            archives,
            thresholdsMb: { targetAvailableSpace: 1200 },
          };
          fs.writeFileSync("/tmp/growth-archive-offload/offload-manifest.json", JSON.stringify(manifest, null, 2));
          NODE
          upload_and_readback_asset /tmp/growth-archive-offload/offload-manifest.json
          sha256sum /tmp/growth-archive-offload/offload-manifest.json > /tmp/growth-archive-offload/DELETE_READY
      - name: Upload GitHub archive offload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: growth-archive-offload-${{ github.run_id }}
          path: /tmp/growth-archive-offload
          if-no-files-found: error
          retention-days: 30
      - name: Delete only release-verified unchanged shards from Fly
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -f /tmp/growth-archive-offload/EMPTY ]; then
            exit 0
          fi
          test -s /tmp/growth-archive-offload/DELETE_READY
          test -s /tmp/growth-archive-offload/verified-assets.tsv
          BATCH_ID=$(cat /tmp/growth-archive-offload/batch-id.txt)
          while IFS=$'\t' read -r dir asset_name asset_bytes asset_sha source_fingerprint source_bytes; do
            [ -n "$dir" ] || continue
            awk -F '\t' -v asset="$asset_name" -v bytes="$asset_bytes" -v sha="$asset_sha" \
              '$1 == asset && $2 == bytes && $3 == sha { found=1 } END { exit(found ? 0 : 1) }' \
              /tmp/growth-archive-offload/verified-assets.tsv
            DELETED=false
            for attempt in $(seq 1 20); do
              if flyctl ssh console -a mvstudiopro \
                -C "sh -s -- delete '$BATCH_ID' '$dir' '$source_fingerprint'" \
                < scripts/growth-archive-offload-remote.sh; then
                DELETED=true
                break
              fi
              echo "采集 lease 或前台任务繁忙，删除继续让行：$dir（${attempt}/20）"
              sleep 30
            done
            test "$DELETED" = "true"
          done < /tmp/growth-archive-offload/assets.tsv
          flyctl ssh console -a mvstudiopro \
            -C "sh -s -- cleanup '$BATCH_ID'" \
            < scripts/growth-archive-offload-remote.sh
      - name: Always release archive hardlink snapshot
        if: always()
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ ! -s /tmp/growth-archive-offload/batch-id.txt ]; then
            exit 0
          fi
          BATCH_ID=$(cat /tmp/growth-archive-offload/batch-id.txt)
          flyctl ssh console -a mvstudiopro \
            -C "sh -s -- cleanup '$BATCH_ID'" \
            < scripts/growth-archive-offload-remote.sh || true
