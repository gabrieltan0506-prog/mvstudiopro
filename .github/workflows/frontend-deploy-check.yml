# 前台发版看门狗。
#
# 2026-08-05 23:44 一个构建命令写坏，Vercel 此后每一次构建都失败，www 停在旧版本
# 整整六小时——期间四张 PR 照常合进 main，Fly Deploy 全绿，没有任何一处报红，
# 直到用户发现导航名字没改、/blog 全 404、刚上线的上传改动根本没生效。
#
# 这个 workflow 就是补那道缺口：合进 main 之后，前台没真正发出去就报红。
name: Frontend Deploy Check

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: 等 Vercel production 部署结果
        id: deploy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -uo pipefail
          state=""
          for i in $(seq 1 60); do
            id=$(gh api "repos/$REPO/deployments?sha=$SHA&environment=Production&per_page=1" --jq '.[0].id // empty')
            if [ -n "$id" ]; then
              state=$(gh api "repos/$REPO/deployments/$id/statuses?per_page=1" --jq '.[0].state // empty')
              echo "[$i] deployment=$id state=${state:-pending}"
              case "$state" in success|failure|error) break ;; esac
            else
              echo "[$i] 等 Vercel 建 deployment…"
            fi
            sleep 20
          done
          if [ "$state" != "success" ]; then
            echo "::error::www 前台部署未成功（state=${state:-timeout}）。合进 main 的前台改动不会上线，请查 Vercel 构建日志。"
            exit 1
          fi

      - name: 核对正式域名能拿到关键页
        run: |
          set -uo pipefail
          fail=0
          for u in / /llms.txt /robots.txt /sitemap.xml /blog/; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://www.mvstudiopro.com$u")
            echo "$u -> $code"
            [ "$code" = "200" ] || { echo "::error::https://www.mvstudiopro.com$u 返回 $code"; fail=1; }
          done
          exit $fail
