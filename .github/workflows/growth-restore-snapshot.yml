name: Growth 恢复快照（必须从本机回灌）

on:
  workflow_dispatch:

jobs:
  restore-disabled:
    runs-on: ubuntu-latest
    steps:
      - name: 阻止不安全的 GitHub 直传 Fly 恢复
        run: |
          echo "此工作流已主动停用。"
          echo "GitHub 直传曾截断大文件，而且旧恢复流程不具备批次原子性。"
          echo "正式路径：把清单全部分片顺序下载到操作员 Mac，逐片及整文件核验 SHA-256、字节数和 gzip，再从本机执行 Fly 单平台原子恢复。"
          echo "禁止从混合快照批次一次恢复全部平台。"
          exit 1
