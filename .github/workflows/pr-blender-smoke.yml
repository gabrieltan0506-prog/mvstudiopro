# PR 构建探针：用生产 Dockerfile 在 linux/amd64 上只构建、不推镜像、不部署、不读生产 secrets，
# 然后在构建出的容器里真实跑低模绑骨自测（含预览渲染，走 xvfb），把日志/预览图/回执存成 artifact。
# 口径：CI 通过只证明该容器里的合成模型链路通过；不证明 74 万顶点真模、材质保真、内存峰值与形变质量。
name: PR Blender Smoke
on:
  pull_request:
    paths:
      - Dockerfile
      - server/scripts/**
      - shared/manhuaAutoRig.ts
      - .github/workflows/pr-blender-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  blender-smoke:
    name: Build image and run auto-rig smoke
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: pr-blender-smoke-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build production image (linux/amd64, no push)
        run: |
          docker buildx build --platform linux/amd64 --load -t mvstudiopro-pr-smoke:${{ github.sha }} .
      - name: Run auto-rig smoke inside the built image
        timeout-minutes: 20
        run: |
          set -o pipefail
          mkdir -p artifacts/auto-rig-smoke
          docker run --rm --platform linux/amd64 \
            -v "$PWD/artifacts/auto-rig-smoke:/out" \
            mvstudiopro-pr-smoke:${{ github.sha }} \
            sh -c 'blender --background --factory-startup --version | grep -m1 "^Blender " | tee /out/blender-version.txt \
              && xvfb-run -a blender --background --factory-startup --disable-autoexec --threads 1 --python-exit-code 1 \
                 --python server/scripts/test_auto_rig_digest.py -- /out/digest-1 \
              && xvfb-run -a blender --background --factory-startup --disable-autoexec --threads 1 --python-exit-code 1 \
                 --python server/scripts/test_auto_rig_digest.py -- /out/digest-2 \
              && diff /out/digest-1/digest.json /out/digest-2/digest.json \
              && xvfb-run -a blender --background --factory-startup --disable-autoexec --threads 1 --python-exit-code 1 \
                 --python server/scripts/test_auto_rig_proxy.py -- /out/run' \
            2>&1 | tee artifacts/auto-rig-smoke/smoke.log
          # 容器以 root 写出（mkdtemp 目录 0700），runner 用户扫不进去 → 上传前放开读权限
          sudo chmod -R a+rX artifacts/auto-rig-smoke
          echo "tested_sha=${{ github.event.pull_request.head.sha || github.sha }}" | tee artifacts/auto-rig-smoke/tested-sha.txt
          grep -q "^TEST_OK" artifacts/auto-rig-smoke/smoke.log
          echo "== Blender =="; cat artifacts/auto-rig-smoke/blender-version.txt
          grep -q "^Blender " artifacts/auto-rig-smoke/blender-version.txt
          echo "== TEST_OK =="; grep "^TEST_OK" artifacts/auto-rig-smoke/smoke.log
      - name: Run drama-action previs smoke inside the built image
        timeout-minutes: 20
        run: |
          set -o pipefail
          mkdir -p artifacts/drama-actions
          docker run --rm --platform linux/amd64 \
            -v "$PWD/artifacts/drama-actions:/out" \
            mvstudiopro-pr-smoke:${{ github.sha }} \
            sh -c 'xvfb-run -a blender --background --factory-startup --disable-autoexec --threads 1 --python-exit-code 1 \
                 --python server/scripts/test_previs_drama_actions.py -- /out/run' \
            2>&1 | tee artifacts/drama-actions/smoke.log
          sudo chmod -R a+rX artifacts/drama-actions
          # 每条断言都量真实骨骼位移并配 idle 反例；线上是 Blender 3.4.1，本机 5.2.1 过不算数
          grep -q "^TEST_OK" artifacts/drama-actions/smoke.log
          echo "== 文戏动作实测 =="; cat artifacts/drama-actions/run/report.json
      - name: Run drama-action RIGGED-MODEL smoke inside the built image
        timeout-minutes: 30
        run: |
          set -o pipefail
          mkdir -p artifacts/drama-rigged
          docker run --rm --platform linux/amd64 \
            -v "$PWD/artifacts/drama-rigged:/out" \
            mvstudiopro-pr-smoke:${{ github.sha }} \
            sh -c 'xvfb-run -a blender --background --factory-startup --disable-autoexec --threads 1 --python-exit-code 1 \
                 --python server/scripts/test_previs_drama_rigged.py -- /out/run' \
            2>&1 | tee artifacts/drama-rigged/smoke.log
          sudo chmod -R a+rX artifacts/drama-rigged
          # 自造 1.0 倍 / 1.5 倍两具带骨夹具，量落座深度、脚底接触、膝关节朝向；
          # 每条都配「改坏重定向比例缩放 / 去掉坐下门禁」的副本反例。线上 Blender 3.4.1，本机 5.2.1 过不算数
          grep -q "^TEST_OK" artifacts/drama-rigged/smoke.log
          echo "== 真模文戏实测 =="; cat artifacts/drama-rigged/run/report.json
      - name: Upload drama-action rigged artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drama-rigged-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            artifacts/drama-rigged/smoke.log
            artifacts/drama-rigged/run/report.json
            artifacts/drama-rigged/run/**/spec.json
          if-no-files-found: warn
          retention-days: 14
      - name: Upload drama-action artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drama-actions-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            artifacts/drama-actions/smoke.log
            artifacts/drama-actions/run/report.json
            artifacts/drama-actions/run/**/spec.json
          if-no-files-found: warn
          retention-days: 14
      - name: Upload smoke artifacts (log, previews, receipts)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auto-rig-smoke-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            artifacts/auto-rig-smoke/smoke.log
            artifacts/auto-rig-smoke/blender-version.txt
            artifacts/auto-rig-smoke/tested-sha.txt
            artifacts/auto-rig-smoke/run/**/*.png
            artifacts/auto-rig-smoke/run/**/*.json
            artifacts/auto-rig-smoke/digest-*/digest.json
          if-no-files-found: warn
          retention-days: 14
