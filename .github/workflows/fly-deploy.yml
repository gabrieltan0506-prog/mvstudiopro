# See https://fly.io/docs/app-guides/continuous-deployment-with-github-actions/

name: Fly Deploy
on:
  push:
    branches:
      - main
  # 排队中被取消的 run 重跑不出 job（startup_failure），只能另起一次全新 run。
  # 部署此前只认 push，卡住时除了往 main 推空提交没有别的办法。
  workflow_dispatch:

permissions:
  contents: read
  deployments: read

# 后端部署与前台看门狗放在**同一个 workflow** 里当两个并行 job。
#
# 它们本来是两个 workflow，合一次 main 就冒出两条 run，看着像同一件事跑了两遍；
# 用户 2026-08-06 因此误取消了 #1096 与 #1098 的 Fly Deploy——取消掉的恰恰是真正
# 部署后端的那一条。合成一条后一次合并只有一条 run，点进去才分 deploy / frontend。
jobs:
  deploy:
    name: Deploy app
    runs-on: ubuntu-latest
    concurrency:
      group: fly-deploy-${{ github.ref }}
      cancel-in-progress: true
    env:
      APP_NAME: mvstudiopro
      APP_URL: https://mvstudiopro.fly.dev
      IMAGE_TAG: sha-${{ github.sha }}
      IMAGE_REF: registry.fly.io/mvstudiopro:sha-${{ github.sha }}
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: docker/setup-buildx-action@v3
      - name: Fetch pre-deploy growth status
        run: |
          for attempt in 1 2 3 4 5; do
            if npm run growth:fetch-status -- "$APP_URL" /tmp/growth-before.json; then
              exit 0
            fi
            sleep 10
          done
          echo "Warning: failed to fetch pre-deploy growth status, continuing deploy"
      - uses: superfly/flyctl-actions/setup-flyctl@v1
      - name: Authenticate Fly registry & build-push image
        # Fly「flyctl auth docker」寫入的 Registry 口令約 5 分鐘有效（官方文檔）。
        # 將 auth 緊鄰於 buildx --push；若 Registry 間歇性報錯（含 tls/access），在重試環內重新 auth。
        # setup-flyctl 使用 @v1 避免上游 @master 行為漂移。
        run: |
          set -e
          fly_auth_retries() {
            local attempt
            for attempt in 1 2 3 4 5 6; do
              echo "flyctl auth docker attempt ${attempt}/6..."
              if flyctl auth docker; then return 0; fi
              if [ "${attempt}" -lt 6 ]; then sleep 25; fi
            done
            return 1
          }

          push_attempt=1
          max_push_attempts=3
          while [ "${push_attempt}" -le "${max_push_attempts}" ]; do
            echo ">>> Registry push attempt ${push_attempt}/${max_push_attempts} (fresh flyctl auth docker before buildx --push)"

            fly_auth_retries || exit 1

            if docker buildx build --platform linux/amd64 -t "$IMAGE_REF" --push .; then
              exit 0
            fi

            if [ "${push_attempt}" -lt "${max_push_attempts}" ]; then
              echo "buildx push failed; waiting 30s before re-auth retry..."
              sleep 30
            fi
            push_attempt=$((push_attempt + 1))
          done

          exit 1
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Deploy prebuilt image
        # --ha=false：禁止 Fly 在 deploy 时自动繁殖副本机器。
        #   单机部署 + 持久卷 growth_data（jobs / deep-research 写盘）模式下，多机
        #   会导致 Launch 落主机、Poll 落副本（找不到 job 文件）这类幻象错误。
        #   未来要 HA，请先把 Job 状态迁到 Postgres 再去掉这个 flag。
        # deploy 阶段的「Building image」会再打 Fly API（如解析 org）；遇 503 时重试。
        run: |
          set -e
          for attempt in 1 2 3 4 5 6; do
            echo "flyctl deploy attempt $attempt/6..."
            if flyctl deploy --image "$IMAGE_REF" --ha=false; then exit 0; fi
            if [ "$attempt" -lt 6 ]; then sleep 45; fi
          done
          exit 1
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Fetch post-deploy growth status
        run: |
          echo "Waiting 30s for Fly.dev cold-start..."
          sleep 30
          # 大型 platform-current 会在启动后分段挂回真值。HTTP 已可用不代表 59 万条
          # 小红书 current 已完成读取；#1249 正是首个 200 快照过早只有 2 万条而误报。
          # 最多等待 15 分钟，只做只读快照与单调校验，不在部署流程自动改生产数据。
          for attempt in $(seq 1 30); do
            echo "Attempt $attempt/30..."
            if npm run growth:fetch-status -- "$APP_URL" /tmp/growth-after.json; then
              if [ ! -f /tmp/growth-before.json ]; then
                exit 0
              fi
              if npm run growth:verify-monotonic -- ops/growth-monotonic-baseline.json /tmp/growth-before.json /tmp/growth-after.json; then
                echo "Post-deploy growth truth is monotonic."
                exit 0
              fi
              echo "Growth truth is still warming; retrying in 30s."
            fi
            sleep 30
          done
          echo "Warning: post-deploy growth truth did not become monotonic within 15 minutes; final guard will report the regression"
      - name: Verify monotonic growth
        run: |
          if [ -f /tmp/growth-before.json ] && [ -f /tmp/growth-after.json ]; then
            npm run growth:verify-monotonic -- ops/growth-monotonic-baseline.json /tmp/growth-before.json /tmp/growth-after.json
          else
            echo "Skipping monotonic verification because pre/post status snapshots are incomplete"
          fi

  # 前台发版看门狗（原独立 workflow Frontend Deploy Check，2026-08-06 并进来）。
  #
  # 2026-08-05 23:44 一个构建命令写坏，Vercel 此后每一次构建都失败，www 停在旧版本
  # 整整六小时——期间四张 PR 照常合进 main，Fly Deploy 全绿，没有任何一处报红，
  # 直到用户发现导航名字没改、/blog 全 404、刚上线的上传改动根本没生效。
  #
  # 与 deploy 并行：www 走 Vercel、API 走 Fly，两条通道互不依赖，串起来只会白等。
  frontend:
    name: 前台发版检查（www）
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: 等 Vercel production 部署结果
        id: deploy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -uo pipefail
          state=""
          for i in $(seq 1 60); do
            id=$(gh api "repos/$REPO/deployments?sha=$SHA&environment=Production&per_page=1" --jq '.[0].id // empty')
            if [ -n "$id" ]; then
              state=$(gh api "repos/$REPO/deployments/$id/statuses?per_page=1" --jq '.[0].state // empty')
              echo "[$i] deployment=$id state=${state:-pending}"
              case "$state" in success|failure|error) break ;; esac
            else
              echo "[$i] 等 Vercel 建 deployment…"
            fi
            sleep 20
          done
          if [ "$state" != "success" ]; then
            echo "::error::www 前台部署未成功（state=${state:-timeout}）。合进 main 的前台改动不会上线，请查 Vercel 构建日志。"
            exit 1
          fi

      - name: 核对正式域名能拿到关键页
        run: |
          set -uo pipefail
          fail=0
          for u in / /llms.txt /robots.txt /sitemap.xml /blog/; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://www.mvstudiopro.com$u")
            echo "$u -> $code"
            [ "$code" = "200" ] || { echo "::error::https://www.mvstudiopro.com$u 返回 $code"; fail=1; }
          done
          exit $fail
