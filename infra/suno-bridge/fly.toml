# 内部专用 Suno cookie 桥。没有 [[services]] / [http_service]：不分配公网地址，
# 主站经 6PN 访问 http://mvstudiopro-suno-bridge.internal:3000 。
# 部署：cd infra/suno-bridge && fly deploy -a mvstudiopro-suno-bridge
# 密钥（用户亲手）：fly secrets set -a mvstudiopro-suno-bridge SUNO_COOKIE=… TWOCAPTCHA_KEY=…
app = 'mvstudiopro-suno-bridge'
primary_region = 'sin'

[build]
  dockerfile = 'Dockerfile'

[env]
  BROWSER = 'chromium'
  BROWSER_HEADLESS = 'true'
  BROWSER_DISABLE_GPU = 'true'
  PORT = '3000'

[[vm]]
  size = 'shared-cpu-2x'
  memory = '2gb'

[checks]
  [checks.http]
    port = 3000
    type = 'http'
    interval = '30s'
    timeout = '5s'
    grace_period = '60s'
    method = 'GET'
    path = '/api/get_limit'
