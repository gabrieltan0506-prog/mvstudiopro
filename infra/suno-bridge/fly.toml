# 内部专用 Suno cookie 桥。没有 [[services]] / [http_service]：不分配公网地址，
# 主站经 6PN 访问 http://mvstudiopro-suno-bridge.internal:3000 。
# 部署：cd infra/suno-bridge && fly deploy -a mvstudiopro-suno-bridge
# 密钥由用户直接填入 Fly Dashboard 的 Secrets，不写进本机终端或文件。
app = 'mvstudiopro-suno-bridge'
primary_region = 'sin'

[build]
  dockerfile = 'Dockerfile'

[env]
  BROWSER = 'chromium'
  BROWSER_HEADLESS = 'true'
  BROWSER_DISABLE_GPU = 'true'
  PORT = '3000'

[[vm]]
  size = 'shared-cpu-2x'
  memory = '2gb'

# 健康检查只探进程活着，不打 Suno（/api/get_limit 会带 cookie 请求 Suno，30 秒一次没必要给账号加曝光）
[checks]
  [checks.tcp]
    port = 3000
    type = 'tcp'
    interval = '60s'
    timeout = '5s'
    grace_period = '60s'
